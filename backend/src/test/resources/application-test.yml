server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:sugar_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # 并发竞态用例会让多个事务排队等同一机组行锁；放宽 H2 默认 1s 锁等待，
      # 避免慢 CI 上误判锁超时（MySQL 侧 innodb_lock_wait_timeout 默认 50s）
      connection-init-sql: SET LOCK_TIMEOUT 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: WARN
